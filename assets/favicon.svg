  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">JS</text>
  <circle cx="32" cy="46" r="2" fill="#38bdf8" />
